name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: velk
          POSTGRES_PASSWORD: velk
          POSTGRES_DB: velk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velk -d velk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://velk:velk@localhost:5432/velk_test
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_BUCKET: velk-test
      S3_TEST_ACCESS_KEY_ID: minioadmin
      S3_TEST_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm 11
        run: npm install -g npm@11.19.1

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Start an S3-compatible server and create the bucket
        # MinIO no longer publishes community images, so the optional S3 test runs against moto.
        run: |
          python3 -m pip install --quiet 'moto[server]'
          nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/moto-api/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat moto.log; exit 1; fi
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin \
            aws --endpoint-url http://localhost:9000 --region us-east-1 s3 mb s3://velk-test

      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
